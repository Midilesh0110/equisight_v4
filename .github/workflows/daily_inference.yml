name: EquiSight V4 Daily Execution

on:
  workflow_dispatch: 
  schedule:
    # 15 3 = 3:15 AM UTC (Exactly 8:45 AM IST)
    # 1-5 = Strictly Monday through Friday
    - cron: '15 3 * * 1-5'

jobs:
  execute-quant-pipeline:
    runs-on: ubuntu-latest
    
    # Give the bot permission to push the CSV back to the repo
    permissions:
      contents: write 

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' 

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Execute Master Orchestrator
        run: python run_pipeline.py

      - name: 🤖 Auto-Commit Master Ledger
        if: always()
        run: |
          git config --global user.name "EquiSight-Bot"
          git config --global user.email "bot@equisight.local"
          git add equisight_v4_ledger.csv
          git commit -m "Auto-update V4 Ledger: $(date -u)" || echo "No changes to commit"
          git push origin main
