name: EquiSight V4 Daily Execution

on:
  schedule:
    # Runs at 03:15 UTC (8:45 AM IST) every weekday (Mon-Fri)
    - cron: '15 3 * * 1-5'
  workflow_dispatch: # This adds a "Run Now" button on GitHub

jobs:
  execute-quant-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' 

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Execute Master Orchestrator
        run: python run_pipeline.py

      - name: 💾 Upload Daily Directives as Artifacts
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: daily-orders
          path: data/
          overwrite: true